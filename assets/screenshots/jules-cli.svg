<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <rect width="1000" height="550" fill="#0c1017" rx="10"/>
  <!-- Terminal Header -->
  <rect width="1000" height="35" fill="#161b22" rx="10"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
  <text x="500" y="22" fill="#8b949e" font-family="monospace" font-size="13" text-anchor="middle">jules-cli — bash — 100x30</text>

  <!-- Banner -->
  <text x="30" y="70" fill="#3fb950" font-family="monospace" font-weight="bold" font-size="13">=====================================================</text>
  <text x="30" y="90" fill="#3fb950" font-family="monospace" font-weight="bold" font-size="15">  JULES CODE CLI — Interactive Autonomous Shell</text>
  <text x="30" y="110" fill="#3fb950" font-family="monospace" font-size="13">  Powered by Google Jules &amp; Gemini Pro</text>
  <text x="30" y="130" fill="#3fb950" font-family="monospace" font-weight="bold" font-size="13">=====================================================</text>
  <text x="30" y="155" fill="#d2a8ff" font-family="monospace" font-size="12">Workspace: /app | Branch: main | Permission Mode: AUTO</text>

  <!-- Prompt and Output -->
  <text x="30" y="195" fill="#58a6ff" font-family="monospace" font-weight="bold" font-size="13">jules (auto)&gt; <tspan fill="#f0f6fc">fix failing test in auth module</tspan></text>

  <text x="30" y="230" fill="#a5d6ff" font-family="monospace" font-size="12">[INTERPRET] Processing task: &quot;fix failing test in auth module&quot;</text>
  <text x="30" y="255" fill="#a5d6ff" font-family="monospace" font-size="12">[INSPECT] Repository: app | Branch: main | Package Manager: npm</text>
  <text x="30" y="280" fill="#a5d6ff" font-family="monospace" font-size="12">[PLAN] Jules Plan: 1. Connect source -&gt; 2. Generate changes -&gt; 3. Run verification</text>
  <text x="30" y="305" fill="#a5d6ff" font-family="monospace" font-size="12">[EXECUTE] Executing task via Jules Cloud VM Session (jules-session-88f2)</text>
