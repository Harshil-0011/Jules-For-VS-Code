  <text x="30" y="355" fill="#a5d6ff" font-family="monospace" font-size="12">[VERIFY] Executing build and test verification suite</text>
  <text x="30" y="380" fill="#3fb950" font-family="monospace" font-weight="bold" font-size="12">[COMPLETE] Task &quot;fix failing test in auth module&quot; finished with status PASSED</text>

  <text x="30" y="425" fill="#58a6ff" font-family="monospace" font-weight="bold" font-size="13">jules (auto)&gt; <tspan fill="#f0f6fc">/status</tspan></text>
  <text x="30" y="450" fill="#7ee787" font-family="monospace" font-size="12">Repository Status: Path /app | Project: app | Branch: main</text>

  <!-- Cursor -->
  <text x="30" y="490" fill="#58a6ff" font-family="monospace" font-weight="bold" font-size="13">jules (auto)&gt; <rect x="150" y="478" width="10" height="15" fill="#58a6ff"/></text>
