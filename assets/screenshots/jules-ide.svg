<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <rect width="1000" height="550" fill="#0f1419" rx="10"/>
  <!-- App Header Bar -->
  <rect width="1000" height="38" fill="#1a202c" rx="10"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>
  <text x="500" y="24" fill="#61afef" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">JULES CODING IDE v4.0.0 — Standalone AI-Native IDE [Project: Jules-Ecosystem]</text>

  <!-- Left Sidebar Explorer -->
  <rect x="0" y="38" width="200" height="512" fill="#151922"/>
  <text x="15" y="65" fill="#5c6370" font-family="sans-serif" font-weight="bold" font-size="11">WORKSPACE EXPLORER</text>
  <text x="25" y="95" fill="#e06c75" font-family="monospace" font-size="12">📁 apps/</text>
  <text x="40" y="115" fill="#abb2bf" font-family="monospace" font-size="11">📁 jules-cli</text>
  <text x="40" y="135" fill="#abb2bf" font-family="monospace" font-size="11">📁 jules-extension</text>
  <text x="40" y="155" fill="#abb2bf" font-family="monospace" font-size="11">📁 jules-ide</text>
  <text x="25" y="180" fill="#e5c07b" font-family="monospace" font-size="12">📁 server/</text>
  <text x="40" y="200" fill="#61afef" font-family="monospace" font-size="11">📄 index.ts</text>
  <text x="40" y="220" fill="#abb2bf" font-family="monospace" font-size="11">📁 gateway</text>

  <!-- Code Editor Panel -->
  <rect x="200" y="38" width="450" height="512" fill="#0f1419"/>
  <rect x="200" y="38" width="450" height="30" fill="#1a202c"/>
  <text x="215" y="58" fill="#98c379" font-family="monospace" font-size="12">server/index.ts</text>

  <text x="215" y="95" fill="#c678dd" font-family="monospace" font-size="12">import <tspan fill="#e06c75">{ startServer }</tspan> from <tspan fill="#98c379">&quot;./gateway&quot;</tspan>;</text>
  <text x="215" y="125" fill="#5c6370" font-family="monospace" font-size="12">// Launch Autonomous Jules Platform Gateway</text>
  <text x="215" y="155" fill="#c678dd" font-family="monospace" font-size="12">const <tspan fill="#e5c07b">server</tspan> = <tspan fill="#61afef">startServer</tspan>(3000);</text>
  <text x="215" y="185" fill="#61afef" font-family="monospace" font-size="12">console.<tspan fill="#56b6c2">log</tspan>(<tspan fill="#98c379">&quot;Jules Platform Active on port 3000&quot;</tspan>);</text>

  <!-- Terminal Panel -->
  <rect x="200" y="370" width="450" height="180" fill="#12161f"/>
  <text x="215" y="390" fill="#5c6370" font-family="sans-serif" font-size="11" font-weight="bold">INTEGRATED TERMINAL</text>
  <text x="215" y="415" fill="#98c379" font-family="monospace" font-size="11">$ npm run build &amp;&amp; npm test</text>
  <text x="215" y="435" fill="#abb2bf" font-family="monospace" font-size="11">PASS tests/unit/ide.test.ts</text>
  <text x="215" y="455" fill="#98c379" font-family="monospace" font-size="11">Test Suites: 13 passed, 13 total (61 tests)</text>

  <!-- Right Side Diagnostics & Web Preview -->
  <rect x="650" y="38" width="350" height="250" fill="#151922"/>
  <rect x="650" y="38" width="350" height="30" fill="#1a202c"/>
  <text x="665" y="58" fill="#abb2bf" font-family="sans-serif" font-weight="bold" font-size="12">WEB PREVIEW &amp; DIAGNOSTICS</text>

  <rect x="665" y="80" width="320" height="190" fill="#0f1419" rx="5" stroke="#282c34"/>
  <rect x="665" y="80" width="320" height="25" fill="#21252b"/>
  <text x="675" y="96" fill="#98c379" font-family="monospace" font-size="11">http://localhost:3000/preview</text>
  <text x="680" y="130" fill="#61afef" font-family="sans-serif" font-weight="bold" font-size="14">Jules Coding IDE Live Web Preview</text>
  <text x="680" y="155" fill="#abb2bf" font-family="sans-serif" font-size="12">Workspace Diagnostics: 0 Errors | 0 Warnings</text>

  <!-- Agent Team Panel -->
  <rect x="650" y="288" width="350" height="262" fill="#1a202c"/>
  <text x="665" y="310" fill="#61afef" font-family="sans-serif" font-weight="bold" font-size="12">AGENT TEAM PANEL</text>

  <rect x="665" y="325" width="320" height="50" fill="#0f1419" rx="5"/>
  <text x="675" y="345" fill="#98c379" font-family="sans-serif" font-size="12" font-weight="bold">Agent: Lead Developer</text>
  <text x="675" y="362" fill="#abb2bf" font-family="monospace" font-size="11">Status: Running Autonomous Loop</text>

  <rect x="665" y="385" width="320" height="50" fill="#0f1419" rx="5"/>
  <text x="675" y="405" fill="#e06c75" font-family="sans-serif" font-size="12" font-weight="bold">Agent: Security Reviewer</text>
  <text x="675" y="422" fill="#abb2bf" font-family="monospace" font-size="11">Status: Zero-Trust Policy Audit Passed</text>
</svg>
